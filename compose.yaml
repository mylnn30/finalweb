
services:
  finalweb_mysql:
    image: mysql:latest
    container_name: finalweb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - finalweb_db_data:/var/lib/mysql
    networks:
      - finalweb_network

  finalweb_phpmyadmin:
    image: phpmyadmin:latest
    container_name: finalweb_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: finalweb_mysql
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - finalweb_network

  finalweb_php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finalweb_php
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@finalweb_mysql:3306/${MYSQL_DATABASE}?serverVersion=26.7.0&charset=utf8mb4"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:8001:8000"
    command: php -S 0.0.0.0:8000 -t public public/router.php
    depends_on:
      - finalweb_mysql
    networks:
      - finalweb_network

volumes:
  finalweb_db_data:

networks:
  finalweb_network:
